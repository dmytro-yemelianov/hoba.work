<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Minimalist Geometric HOBA Cat Icon -->
  <!-- Horizontal Leg Form -->
  <line x1="20" y1="75" x2="80" y2="75" stroke="#58a6ff" stroke-width="8" stroke-linecap="round"/>
  <!-- Raised Diagonal Leg Form (45 deg) -->
  <line x1="45" y1="75" x2="80" y2="25" stroke="#58a6ff" stroke-width="8" stroke-linecap="round"/>
  <!-- Circular Head nestled between legs -->
  <circle cx="45" cy="55" r="16" fill="#e6edf3"/>
  <!-- Geometric Triangular Ears -->
  <polygon points="35,42 41,28 47,40" fill="#e6edf3"/>
  <polygon points="48,40 55,30 58,44" fill="#e6edf3"/>
</svg>
