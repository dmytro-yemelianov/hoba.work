# A remote posting can still be bounded by payroll/entity coverage. This
# scenario keeps "remote" and "contractable jurisdiction" separate so the
# case-space can represent remote work that fails at the employment vehicle.
id: scenario.remote_country_payroll_mismatch
title:
  en: "Remote role, country payroll mismatch"
  uk: "Віддалена роль і невідповідність країни payroll-покриттю"
summary: "A role is presented as remote, the screen proceeds normally, and the closing reason later names residence, work eligibility, or an unsupported contracting country."
observations:
  - "obs.rejection_naming_a_jurisdiction_or_work_eligibility_ground"
compatible_mechanisms:
  - "mech.location_or_timezone_compliance_constraint"
  - "mech.hidden_evaluation_rubric_or_undisclosed_priority"
compatible_barriers:
  - "bar.recruiter_screening_call"
  - "bar.offer_closing_contract_execution"
process_states:
  - "proc.the_hiring_funnel_end_to_end"
excluded_claims:
  - "The remote label means the employer can issue a contract in every country."
  - "The jurisdiction ground proves that no technical or cohort evaluation happened."
  - "The recruiter personally controls the payroll coverage list."
agency:
  candidate:
    - "int.contractable_jurisdictions_listed_in_the_posting"
  employer-policy:
    - "int.contractable_jurisdictions_listed_in_the_posting"
  recruiter:
    - "int.screening_note_bound_to_observations_and_disposition_codes"
case_assignments:
  - coordinate: "party.set"
    status: "known"
    value:
      - "candidate"
      - "recruiter"
      - "employer_policy"
    basis: "The observation is a recruiter message, but the contractability list belongs to employer policy rather than the individual recruiter."
  - coordinate: "entry.path"
    status: "known"
    value: "inbound"
    basis: "The scenario starts from a posted remote role and a candidate entering the ordinary hiring funnel."
  - coordinate: "arrangement"
    status: "known"
    value: "permanent"
    basis: "The mechanism concerns issuing an employment contract, not a freelance statement of work."
  - coordinate: "domain"
    status: "known"
    value: "software"
    basis: "The role is held in the atlas' default software hiring domain unless a client or regulated sector is named."
  - coordinate: "worksite.mode"
    status: "known"
    value: "remote_national"
    basis: "The work is described as remote, but the accepted place is bounded by a national contractability list."
  - coordinate: "worksite.anchor"
    status: "known"
    value: "entity_jurisdiction"
    basis: "The operative worksite constraint is not a desk or commute radius; it is the country where an entity or provider can issue the contract."
  - coordinate: "worksite.cadence"
    status: "known"
    value: "none"
    basis: "The case has no regular office attendance; the failure is legal/payroll coverage, not a required office week."
  - coordinate: "jurisdiction"
    status: "known"
    value: "cross_border"
    basis: "The mismatch exists because residence and contractability coverage do not sit inside the same local hiring regime."
  - coordinate: "block.owner"
    status: "known"
    value: "inside"
    basis: "The constraint is maintained by employer policy and payroll coverage, even if the recruiter only relays it."
  - coordinate: "block.determinacy"
    status: "known"
    value: "deterministic"
    basis: "A country either appears on the employer's contractability list for this role or it does not."
  - coordinate: "block.arity"
    status: "known"
    value: "absolute"
    basis: "The candidate is blocked by a rule about their location, not by comparison with another candidate."
  - coordinate: "block.nature"
    status: "known"
    value: "rule"
    basis: "The mechanism is a compliance and payroll rule rather than an interviewer judgement."
  - coordinate: "latitude.employer"
    status: "known"
    value: "rigid"
    basis: "For this process the recruiter cannot add a legal entity or payroll provider to cover the candidate's country."
  - coordinate: "latitude.candidate"
    status: "unknown"
    basis: "The scenario does not state whether relocation, a different contract form, or withdrawal was possible for the candidate."
  - coordinate: "bargain.state"
    status: "known"
    value: "undetermined"
    basis: "Employer latitude is fixed, but candidate latitude is not stated, so overlap cannot be computed from the authored case."
  - coordinate: "statement.fidelity"
    status: "known"
    value: "direct"
    basis: "The closing message names the jurisdiction or work-eligibility ground rather than burying it in a generic template."
  - coordinate: "outcome.signal"
    status: "known"
    value: "generic_rejection"
    basis: "The process closes without a hire; the specific ground is legible, but the artifact remains a rejection."
  - coordinate: "visibility.candidate"
    status: "known"
    value: "partial"
    basis: "The candidate sees the stated location ground, but not the internal payroll coverage route or exception calendar."
