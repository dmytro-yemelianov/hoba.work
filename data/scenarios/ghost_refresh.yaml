# Migrated from the hardcoded EMPIRICAL_SCENARIOS array in diagnostics.ts.
# Carries `summary` and `stage`, which is what makes it usable as a
# diagnostic preset rather than only a composition to read.
id: scenario.ghost_refresh
title:
  en: "Ghost Requisition & Pipeline Refresh"
  uk: "Вакансія-привид і оновлення пайплайну"
summary: "Stale posting refreshed with identical body while active applicants experience silence."
stage: "sourcing"
observations:
  - "obs.complete_silence_after_submission"
  - "obs.materially_similar_role_reposted_shortly_after_rejection"
  - "obs.republished_job_posting_with_refreshed_date_and_identical_requirement_body"
case_assignments:
  - coordinate: "stage.terminal"
    status: "known"
    value: "sourcing"
    basis: "The diagnostic preset stage is sourcing and the scenario is about posting refresh behavior."
  - coordinate: "entry.path"
    status: "known"
    value: "inbound"
    basis: "The scenario explicitly combines active applicants with silence after submission."
  - coordinate: "requisition.state"
    status: "inferred"
    value: "stale_orphaned"
    basis: "The scenario names a ghost requisition and an identical refreshed posting body."
  - coordinate: "outcome.signal"
    status: "known"
    value: "closure_or_repost"
    basis: "The distinctive public signal is a refreshed or reposted vacancy, not a final causal explanation."
  - coordinate: "funding.state"
    status: "unknown"
    basis: "A refreshed posting may be funded, stale, speculative, or awaiting approval."
  - coordinate: "worksite.mode"
    status: "unknown"
    basis: "The scenario does not say whether the refreshed posting is onsite, hybrid, or remote."
  - coordinate: "visibility.candidate"
    status: "inferred"
    value: "partial"
    basis: "The candidate can see the refreshed posting and silence but cannot see the requisition owner or funding state."
