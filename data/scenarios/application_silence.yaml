# The design doc's own worked example (§4), grounded in entities the registry
# actually holds. A scenario names what was seen and what could be behind it;
# it never asserts which.
id: scenario.application_silence
title:
  en: "Application followed by silence"
  uk: "Відгук без подальшої відповіді"
observations:
  - "obs.complete_silence_after_submission"
  - "obs.rejection_after_the_application_sat_pending_for_months"
compatible_mechanisms:
  - "mech.stale_or_orphaned_job_requisition"
  - "mech.automated_application_expiration_timeout"
  - "mech.ats_parser_extraction_failure"
  - "mech.recruiter_volume_quota_incentive_distortion"
  - "mech.speculative_sourcing_talent_pooling_without_opening"
compatible_barriers:
  - "bar.application_ingestion"
  - "bar.automated_filter_parser_threshold"
  - "bar.inbound_screening_triage"
process_states:
  - "proc.an_application_inside_the_ats"
excluded_claims:
  - "The recruiter deliberately ghosted the candidate."
  - "The application was read and rejected on its merits."
  - "The requisition was open at the moment the application arrived."
agency:
  candidate:
    - "int.candidate_ats_parser_conformance_test_utility"
    - "int.candidate_work_index_submitted_with_the_application"
  employer-policy:
    - "int.auto_close_stale_job_requisitions"
    - "int.distinct_closure_status_for_unreviewed_applications"
  recruiter:
    - "int.screening_note_bound_to_observations_and_disposition_codes"
case_assignments:
  - coordinate: "entry.path"
    status: "known"
    value: "inbound"
    basis: "The scenario starts after a submitted application and names the ATS application process."
  - coordinate: "outcome.signal"
    status: "known"
    value: "no_response"
    basis: "The defining observation is silence after submission; a later generic disposition does not identify the cause."
  - coordinate: "requisition.state"
    status: "unknown"
    basis: "The compatible mechanisms include stale, expired, parser-failed, quota-driven, and speculative-pool explanations."
  - coordinate: "worksite.mode"
    status: "unknown"
    basis: "No scenario field or linked observation states whether the job was onsite, hybrid, or remote."
  - coordinate: "latitude.employer"
    status: "unknown"
    basis: "The scenario does not reveal whether anyone inside or outside the employer can reopen or alter the condition."
  - coordinate: "latitude.candidate"
    status: "unknown"
    basis: "The scenario records submitted material but no candidate-side constraint or exchange condition."
