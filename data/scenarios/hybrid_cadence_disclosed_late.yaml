# Hybrid requirements are not just labels. A fixed weekly cadence can be the
# blocking condition even when the job was otherwise a plausible match.
id: scenario.hybrid_cadence_disclosed_late
title:
  en: "Hybrid cadence appears after screening"
  uk: "Гібридна каденція зʼявляється після скринінгу"
summary: "A candidate passes the first compatibility checks, then the process closes because a fixed office cadence or city anchor was not stated early enough to be evaluated before the screen."
observations:
  - "obs.rejection_naming_a_jurisdiction_or_work_eligibility_ground"
  - "obs.generic_closer_alignment_rejection_template"
compatible_mechanisms:
  - "mech.location_or_timezone_compliance_constraint"
  - "mech.hidden_evaluation_rubric_or_undisclosed_priority"
compatible_barriers:
  - "bar.recruiter_screening_call"
  - "bar.inbound_screening_triage"
process_states:
  - "proc.the_path_as_it_is_supposed_to_run"
excluded_claims:
  - "The word hybrid is enough to disclose the weekly attendance burden."
  - "The candidate rejected the employer rather than failing an undisclosed condition."
  - "The attendance rule proves a lack of skill or interest."
agency:
  candidate:
    - "int.contractable_jurisdictions_listed_in_the_posting"
  employer-policy:
    - "int.disqualifying_criteria_published_with_the_posting"
    - "int.screening_note_bound_to_observations_and_disposition_codes"
  recruiter:
    - "int.screening_note_bound_to_observations_and_disposition_codes"
case_assignments:
  - coordinate: "party.set"
    status: "known"
    value:
      - "candidate"
      - "recruiter"
      - "employer_policy"
    basis: "The candidate and recruiter encounter the requirement, while employer policy defines what cadence is disqualifying."
  - coordinate: "entry.path"
    status: "known"
    value: "inbound"
    basis: "The candidate entered through a posted process and reached an initial screen."
  - coordinate: "arrangement"
    status: "known"
    value: "permanent"
    basis: "The scenario describes a job process rather than a temporary shift assignment or freelance statement of work."
  - coordinate: "domain"
    status: "known"
    value: "software"
    basis: "No client, public-sector, or regulated-profession overlay is part of this scenario."
  - coordinate: "worksite.mode"
    status: "known"
    value: "hybrid_fixed"
    basis: "The scenario is specifically about a named weekly office cadence rather than optional occasional attendance."
  - coordinate: "worksite.anchor"
    status: "known"
    value: "named_city"
    basis: "A fixed hybrid cadence must be attached to a concrete city or office location to become a real constraint."
  - coordinate: "worksite.cadence"
    status: "known"
    value: "2_3_per_week"
    basis: "The authored case represents the common two-to-three-day hybrid requirement rather than occasional attendance."
  - coordinate: "cost.borne_by"
    status: "known"
    value:
      - "candidate"
    basis: "The operative cost is the candidate-side commute, care, access, or relocation burden created by a fixed office cadence."
  - coordinate: "block.owner"
    status: "known"
    value: "inside"
    basis: "The attendance rule is an employer-side policy or team operating constraint, not an external legal bar."
  - coordinate: "block.determinacy"
    status: "known"
    value: "deterministic"
    basis: "Once the weekly cadence is fixed, the candidate either can meet it for this office or cannot."
  - coordinate: "block.arity"
    status: "known"
    value: "absolute"
    basis: "The failure is against an attendance condition, not against another candidate's score."
  - coordinate: "block.nature"
    status: "known"
    value: "rule"
    basis: "The condition is a format rule about where work must happen, not a subjective panel judgement."
  - coordinate: "latitude.employer"
    status: "known"
    value: "slack_inside"
    basis: "The employer may be able to move the cadence or city rule internally, but that exception is not in the recruiter screen itself."
  - coordinate: "latitude.candidate"
    status: "known"
    value: "slack_conditional"
    basis: "The candidate could trade format for another condition, such as relocation timing or fewer office days, rather than simply accept or refuse."
  - coordinate: "bargain.state"
    status: "known"
    value: "undetermined"
    basis: "Both sides may have some latitude, but the scenario does not show an actual negotiated overlap."
  - coordinate: "statement.fidelity"
    status: "known"
    value: "distortion"
    basis: "A generic remote-or-hybrid label hides the weekly burden until after the candidate has already spent screening effort."
  - coordinate: "distortion.origin"
    status: "known"
    value: "speaker"
    basis: "The under-specified worksite condition comes from how the role is described, not from an ATS parsing failure."
  - coordinate: "outcome.signal"
    status: "known"
    value: "generic_rejection"
    basis: "The observed terminal artifact is a rejection after compatibility screening, not a successful hire or offer change."
  - coordinate: "population.affected"
    status: "known"
    value:
      - "caregiving"
      - "disability_accommodation"
      - "displacement"
    basis: "Fixed attendance cadence can be the operative gate for caregiving, access, and displacement constraints without proving bias."
  - coordinate: "visibility.candidate"
    status: "known"
    value: "partial"
    basis: "The candidate sees the late attendance condition but not whether an internal exception route exists."
