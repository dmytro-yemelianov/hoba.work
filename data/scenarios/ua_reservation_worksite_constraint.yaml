# Ukrainian military registration status can interact with place-of-work and
# employer-side reservation authority. This scenario records the structural
# shape without asserting a legal rule beyond the case-space coordinate.
id: scenario.ua_reservation_worksite_constraint
title:
  en: "Ukrainian reservation status meets worksite constraint"
  uk: "Український статус бронювання стикається з вимогою місця роботи"
summary: "A Ukrainian hiring process becomes constrained by the interaction between military registration status, employer reservation capacity, and where the role must be performed."
observations:
  - "obs.rejection_naming_a_jurisdiction_or_work_eligibility_ground"
  - "obs.offer_accepted_followed_by_delayed_start_date_or_post_signing_revocation"
compatible_mechanisms:
  - "mech.location_or_timezone_compliance_constraint"
  - "mech.start_date_slippage_and_post_acceptance_revocation"
compatible_barriers:
  - "bar.recruiter_screening_call"
  - "bar.offer_closing_contract_execution"
  - "bar.reference_background_verification"
process_states:
  - "proc.the_hiring_funnel_end_to_end"
excluded_claims:
  - "The military-status constraint proves discriminatory intent."
  - "Every Ukrainian employer can create or waive reservation status for any candidate."
  - "The candidate's registration state is interchangeable with ordinary relocation preference."
agency:
  candidate:
    - "int.contractable_jurisdictions_listed_in_the_posting"
  employer-policy:
    - "int.disqualifying_criteria_published_with_the_posting"
    - "int.verification_discrepancy_disclosure_and_reconciliation_window"
  recruiter:
    - "int.screening_note_bound_to_observations_and_disposition_codes"
case_assignments:
  - coordinate: "party.set"
    status: "known"
    value:
      - "candidate"
      - "recruiter"
      - "employer_policy"
      - "public_policy"
    basis: "The candidate and recruiter encounter the constraint, while employer policy and public policy determine reservation and registration treatment."
  - coordinate: "entry.path"
    status: "known"
    value: "inbound"
    basis: "The scenario starts from an ordinary hiring process rather than a rehire or referral route."
  - coordinate: "arrangement"
    status: "known"
    value: "permanent"
    basis: "Reservation and employment-status questions arise around an employment role, not a freelance statement of work."
  - coordinate: "domain"
    status: "known"
    value: "software"
    basis: "The scenario keeps the atlas' software hiring baseline and varies the Ukrainian administrative condition."
  - coordinate: "worksite.mode"
    status: "known"
    value: "hybrid_fixed"
    basis: "The case is about a concrete attendance requirement rather than a fully remote global role."
  - coordinate: "worksite.anchor"
    status: "known"
    value: "named_city"
    basis: "The role is anchored to a Ukrainian hiring location rather than only to payroll entity coverage."
  - coordinate: "worksite.cadence"
    status: "known"
    value: "1_per_week"
    basis: "A minimal regular attendance requirement is enough to interact with registration and movement constraints."
  - coordinate: "jurisdiction"
    status: "known"
    value: "ua"
    basis: "The scenario is explicitly about Ukrainian military registration and employer reservation status."
  - coordinate: "military.status"
    status: "known"
    value: "reserved_by_employer"
    basis: "The structural case concerns a role whose feasibility depends on employer-linked reservation treatment."
  - coordinate: "population.affected"
    status: "known"
    value:
      - "military_status"
      - "gender_pregnancy"
      - "age"
    basis: "Military registration interacts with gendered service rules and age bands even when the scenario does not assert discriminatory motive."
  - coordinate: "principal.side"
    status: "known"
    value: "exterior_force"
    basis: "The decisive condition comes from an administrative regime outside the ordinary interview evaluation."
  - coordinate: "block.owner"
    status: "known"
    value: "outside_party"
    basis: "Reservation status is not owned solely by the recruiter or hiring manager inside the interview loop."
  - coordinate: "block.determinacy"
    status: "known"
    value: "deterministic"
    basis: "For a particular role and candidate, the administrative status either satisfies the condition or it does not."
  - coordinate: "block.arity"
    status: "known"
    value: "absolute"
    basis: "The block concerns whether this candidate can occupy this role under the condition, not relative merit against another candidate."
  - coordinate: "block.nature"
    status: "known"
    value: "rule"
    basis: "The coordinate is a public-policy and employer-policy rule, not a panel taste judgement."
  - coordinate: "latitude.employer"
    status: "known"
    value: "slack_outside_party"
    basis: "If an exception or reservation route exists, it is controlled outside the individual recruiter conversation."
  - coordinate: "latitude.candidate"
    status: "known"
    value: "rigid"
    basis: "The candidate cannot personally change the employer's reservation capacity during the hiring loop."
  - coordinate: "bargain.state"
    status: "known"
    value: "disjoint"
    basis: "The authored case is one where the required worksite and administrative status do not produce an available agreement."
  - coordinate: "statement.fidelity"
    status: "known"
    value: "direct"
    basis: "The closing condition can be named as eligibility or administrative status rather than disguised as general fit."
  - coordinate: "outcome.signal"
    status: "known"
    value: "offer_delay_or_rescind"
    basis: "The scenario uses the post-offer delay or revocation observation as the visible terminal signal."
  - coordinate: "epilogue"
    status: "known"
    value: "post_acceptance_revocation"
    basis: "The case reaches a post-acceptance administrative block rather than stopping at screening."
  - coordinate: "visibility.candidate"
    status: "known"
    value: "partial"
    basis: "The candidate can see the administrative issue but not the whole route by which an employer-side reservation decision is made."
