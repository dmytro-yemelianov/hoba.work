# Migrated from the hardcoded EMPIRICAL_SCENARIOS array in diagnostics.ts.
# Carries `summary` and `stage`, which is what makes it usable as a
# diagnostic preset rather than only a composition to read.
id: scenario.downlevelling_trap
title:
  en: "Down-Levelling & Delayed Start"
  uk: "Пониження рівня і зсув дати виходу"
summary: "Scope expansion, sub-band compensation offer, and post-acceptance start date slippage."
stage: "post-offer"
observations:
  - "obs.rejection_naming_a_jurisdiction_or_work_eligibility_ground"
  - "obs.rejection_naming_a_specific_industry_sector_as_required"
  - "obs.offer_accepted_followed_by_delayed_start_date_or_post_signing_revocation"
case_assignments:
  - coordinate: "stage.terminal"
    status: "known"
    value: "post-offer"
    basis: "The diagnostic preset stage is post-offer and includes accepted-offer delay or revocation."
  - coordinate: "outcome.signal"
    status: "known"
    value: "offer_delay_or_rescind"
    basis: "The terminal observation is delayed start date or post-signing revocation after acceptance."
  - coordinate: "epilogue"
    status: "known"
    value: "start_date_shift"
    basis: "The scenario summary names start-date slippage as the epilogue-shaped event."
  - coordinate: "jurisdiction"
    status: "inferred"
    value: "cross_border"
    basis: "The observation names jurisdiction or work-eligibility grounds without specifying a single country."
  - coordinate: "arrangement"
    status: "unknown"
    basis: "Down-levelling and delayed starts can occur in permanent, contract, or contract-to-hire arrangements."
  - coordinate: "worksite.mode"
    status: "unknown"
    basis: "Jurisdiction or eligibility is not the same as where the work must be performed."
  - coordinate: "latitude.employer"
    status: "unknown"
    basis: "The scenario does not state whether the employer can move level, start date, or compensation internally."
  - coordinate: "latitude.candidate"
    status: "unknown"
    basis: "The scenario names candidate-facing changes but not what concessions the candidate can trade against them."
