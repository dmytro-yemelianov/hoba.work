    status: "known"
    value: "internal_fill"
    basis: "The scenario includes a rejection that names an internal hire as the outcome."
  - coordinate: "cohort.state"
    status: "inferred"
    value: "pre_committed_internal"
    basis: "The internal-hire outcome makes an internal cohort relevant, while not proving bad faith or timing."
  - coordinate: "visibility.candidate"
    status: "inferred"
    value: "partial"
    basis: "The candidate sees rescheduling, silence, and an internal-hire statement but not the freeze decision."
  - coordinate: "funding.state"
    status: "unknown"
    basis: "The freeze could be budget, approval, prioritization, or internal-fill driven."
  - coordinate: "worksite.mode"
    status: "unknown"
    basis: "The scenario concerns interview-panel timing and does not state where the job is performed."
  - coordinate: "latitude.employer"
