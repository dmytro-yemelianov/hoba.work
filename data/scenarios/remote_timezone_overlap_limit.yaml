# Timezone overlap is different from legal residence and from office cadence:
# it is remote work with a team-time anchor.
id: scenario.remote_timezone_overlap_limit
title:
  en: "Remote role bounded by timezone overlap"
  uk: "Віддалена роль, обмежена перетином таймзон"
summary: "A role can be performed remotely, but the process closes when the team requires overlap hours that the candidate cannot reliably cover."
observations:
  - "obs.rejection_naming_a_jurisdiction_or_work_eligibility_ground"
  - "obs.communication_mismatch_or_tone_friction_in_panel"
compatible_mechanisms:
  - "mech.location_or_timezone_compliance_constraint"
  - "mech.communication_or_working_style_friction"
compatible_barriers:
  - "bar.recruiter_screening_call"
  - "bar.team_cross_functional_panel"
process_states:
  - "proc.the_path_as_it_is_supposed_to_run"
excluded_claims:
  - "Remote work implies timezone-neutral work."
  - "Timezone mismatch proves a communication-style defect."
  - "The candidate can solve the overlap requirement without a trade-off."
agency:
  candidate:
    - "int.contractable_jurisdictions_listed_in_the_posting"
  employer-policy:
    - "int.disqualifying_criteria_published_with_the_posting"
  recruiter:
    - "int.screening_note_bound_to_observations_and_disposition_codes"
case_assignments:
  - coordinate: "party.set"
    status: "known"
    value:
      - "candidate"
      - "recruiter"
      - "hiring_manager"
      - "employer_policy"
    basis: "The recruiter can ask the timezone question, but the team and employer policy define the overlap requirement."
  - coordinate: "entry.path"
    status: "known"
    value: "inbound"
    basis: "The scenario begins with a candidate pursuing a remote role through the ordinary process."
  - coordinate: "arrangement"
    status: "known"
    value: "permanent"
    basis: "No contractor, vendor, seasonal, or freelance arrangement is part of this scenario."
  - coordinate: "domain"
    status: "known"
    value: "software"
    basis: "The scenario uses remote team coordination in a software role as the default atlas domain."
  - coordinate: "worksite.mode"
    status: "known"
    value: "remote_global"
    basis: "The work can be performed away from an office, but the team still imposes a time-zone overlap rule."
  - coordinate: "worksite.anchor"
    status: "known"
    value: "timezone_band"
    basis: "The operative anchor is not a city or country; it is the hours a candidate can overlap with the team."
  - coordinate: "worksite.cadence"
    status: "known"
    value: "occasional"
    basis: "The remote role may still require occasional synchronous overlap, but not a regular office week."
  - coordinate: "cost.borne_by"
    status: "known"
    value:
      - "candidate"
    basis: "The authored burden is the candidate-side cost of shifting work hours across care, health, or local-time constraints."
  - coordinate: "block.owner"
    status: "known"
    value: "inside"
    basis: "The overlap requirement is owned by the team or employer policy, not by an outside client or statute."
  - coordinate: "block.determinacy"
    status: "known"
    value: "deterministic"
    basis: "A required overlap band either fits the candidate's working hours or it does not."
  - coordinate: "block.arity"
    status: "known"
    value: "absolute"
    basis: "The case is blocked by a schedule rule, not by relative ranking against another applicant."
  - coordinate: "block.nature"
    status: "known"
    value: "rule"
    basis: "The overlap requirement is a coordination rule rather than a taste judgement."
  - coordinate: "latitude.employer"
    status: "known"
    value: "slack_inside"
    basis: "The team might move rituals or overlap hours internally, but no outside party must approve that change."
  - coordinate: "latitude.candidate"
    status: "known"
    value: "slack_conditional"
    basis: "The candidate may shift hours only by trading against care, health, or local-time constraints."
  - coordinate: "bargain.state"
    status: "known"
    value: "undetermined"
    basis: "The scenario shows potential latitude on both sides, but not an actual agreed overlap window."
  - coordinate: "statement.fidelity"
    status: "known"
    value: "direct"
    basis: "The closing reason can truthfully name hours or timezone rather than only general alignment."
  - coordinate: "outcome.signal"
    status: "known"
    value: "generic_rejection"
    basis: "The process terminates without an offer, even when the reason names a time constraint."
  - coordinate: "population.affected"
    status: "known"
    value:
      - "caregiving"
      - "mental_health"
      - "cross_border"
    basis: "Overlap windows can turn care schedules, health boundaries, and cross-border time differences into hiring gates."
  - coordinate: "visibility.candidate"
    status: "known"
    value: "partial"
    basis: "The candidate sees the overlap ask, but not how movable the team's schedule really is."
