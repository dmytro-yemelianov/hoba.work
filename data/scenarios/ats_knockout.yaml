# Migrated from the hardcoded EMPIRICAL_SCENARIOS array in diagnostics.ts.
# Carries `summary` and `stage`, which is what makes it usable as a
# diagnostic preset rather than only a composition to read.
id: scenario.ats_knockout
title:
  en: "Automated Parsing Knockout"
  uk: "Автоматичне відсіювання при парсингу"
summary: "Instant rejection outside business hours combined with rigid uncontextualized filters."
stage: "screening"
observations:
  - "obs.generic_closer_alignment_rejection_template"
  - "obs.explicit_feedback_citing_skill_depth_shortfall"
  - "obs.unsolicited_recruiter_outreach_followed_by_ghosting"
case_assignments:
  - coordinate: "stage.terminal"
    status: "known"
    value: "screening"
    basis: "The diagnostic preset stage is screening, and the title names an automated knockout."
  - coordinate: "outcome.signal"
    status: "known"
    value: "generic_rejection"
    basis: "The scenario includes a generic closer-alignment rejection template as its first observation."
  - coordinate: "statement.fidelity"
    status: "inferred"
    value: "euphemism"
    basis: "The template says closer alignment while the scenario frame treats it as a filter result."
  - coordinate: "block.nature"
    status: "inferred"
    value: "rule"
    basis: "Rigid uncontextualized filters are rule-shaped blocks, not stochastic noise or a named incentive."
  - coordinate: "entry.path"
    status: "unknown"
    basis: "The observations combine outreach and rejection; the scenario does not say whether the candidate applied inbound."
  - coordinate: "worksite.mode"
    status: "unknown"
    basis: "The scenario does not mention workplace format, city anchoring, or in-office cadence."
  - coordinate: "latitude.employer"
    status: "unknown"
    basis: "The scenario describes rigid filters but not whether the employer has override slack inside the process."
