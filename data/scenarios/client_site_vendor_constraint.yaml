# Vendor hiring can be blocked by the client site rather than by the vendor's
# own preference. That is the canonical outside-party slack case.
id: scenario.client_site_vendor_constraint
title:
  en: "Vendor process blocked by client-site terms"
  uk: "Вендорський процес блокується умовами клієнтського майданчика"
summary: "A vendor process advances through internal screening, then the client gate reveals that the work must be performed at a client site or under a client-controlled schedule."
observations:
  - "obs.generic_closer_alignment_rejection_template"
  - "obs.rejection_naming_a_specific_industry_sector_as_required"
compatible_mechanisms:
  - "mech.domain_specificity_over_weighting"
  - "mech.location_or_timezone_compliance_constraint"
  - "mech.bid_conditional_talent_pool"
compatible_barriers:
  - "bar.client_profile_approval_and_client_interview"
  - "bar.recruiter_screening_call"
  - "bar.technical_screen_live_assessment"
process_states:
  - "proc.client_account_hiring_funnel"
excluded_claims:
  - "The vendor can unilaterally waive the client's site or schedule condition."
  - "A generic vendor rejection proves that the candidate failed the vendor's technical screen."
  - "The client-site requirement is ownerless just because it is invisible to the candidate at first."
agency:
  candidate:
    - "int.domain_requirement_carries_a_stated_ramp_time"
  employer-policy:
    - "int.bench_availability_declared_at_each_stage_gate"
  recruiter:
    - "int.outreach_states_the_requisition_behind_it"
case_assignments:
  - coordinate: "party.set"
    status: "known"
    value:
      - "candidate"
      - "recruiter"
      - "hiring_manager"
      - "client"
      - "agency"
    basis: "The vendor presents the candidate, but the client owns the external approval and site conditions."
  - coordinate: "entry.path"
    status: "known"
    value: "agency_submission"
    basis: "The candidate reaches the client through a vendor or agency process rather than direct employer intake."
  - coordinate: "arrangement"
    status: "known"
    value: "contractor"
    basis: "The client-account funnel places labour through a vendor contract and billable client demand."
  - coordinate: "domain"
    status: "known"
    value: "client_vendor_staffing"
    basis: "The defining feature is an end client deciding profile approval and working terms."
  - coordinate: "funding.source"
    status: "known"
    value: "signed_client_contract"
    basis: "The seat exists because client demand funds vendor work, even if the candidate never sees the commercial contract."
  - coordinate: "funding.state"
    status: "known"
    value: "committed"
    basis: "This scenario is the signed-contract branch, not a speculative tender or unwon bid."
  - coordinate: "chain.class"
    status: "known"
    value: "client_margin"
    basis: "The economics run through a client billing rate and vendor margin rather than only internal payroll."
  - coordinate: "worksite.mode"
    status: "known"
    value: "onsite"
    basis: "The blocking condition is work at a client site, not merely a timezone overlap or remote payroll list."
  - coordinate: "worksite.anchor"
    status: "known"
    value: "client_site"
    basis: "The place of work is anchored to the client facility or client-controlled delivery site."
  - coordinate: "worksite.cadence"
    status: "known"
    value: "4_5_per_week"
    basis: "The scenario represents a regular client-site presence requirement rather than occasional visits."
  - coordinate: "principal.side"
    status: "known"
    value: "intermediary_decides"
    basis: "The vendor and client jointly shape the outcome; the direct employer panel is not the sole decider."
  - coordinate: "block.owner"
    status: "known"
    value: "outside_party"
    basis: "The condition belongs to the client gate outside the vendor's immediate recruiting process."
  - coordinate: "block.determinacy"
    status: "known"
    value: "deterministic"
    basis: "The client-site rule either permits the candidate's working arrangement or blocks placement."
  - coordinate: "block.arity"
    status: "known"
    value: "absolute"
    basis: "The gate is a site condition imposed on the seat, not comparison within a finalist cohort."
  - coordinate: "block.nature"
    status: "known"
    value: "rule"
    basis: "The client site term functions as a delivery rule rather than an interviewer's preference."
  - coordinate: "latitude.employer"
    status: "known"
    value: "slack_outside_party"
    basis: "Any waiver or alternative site must be granted by the client, not by the vendor recruiter."
  - coordinate: "latitude.candidate"
    status: "known"
    value: "rigid"
    basis: "The scenario is defined by the candidate being unable to satisfy the client-site attendance term."
  - coordinate: "bargain.state"
    status: "known"
    value: "disjoint"
    basis: "The client's site requirement and the candidate's available work arrangement do not overlap in this case."
  - coordinate: "statement.fidelity"
    status: "known"
    value: "euphemism"
    basis: "The candidate usually sees a fit or alignment message while the client-site ownership remains opaque."
  - coordinate: "outcome.signal"
    status: "known"
    value: "generic_rejection"
    basis: "The visible terminal artifact is a vendor or client rejection rather than a contract execution."
  - coordinate: "population.affected"
    status: "known"
    value:
      - "caregiving"
      - "disability_accommodation"
      - "cross_border"
    basis: "Client-site conditions commonly turn care, access, and border constraints into gates without proving discriminatory intent."
  - coordinate: "visibility.candidate"
    status: "known"
    value: "opaque"
    basis: "The client gate and commercial site terms are usually not visible in the original vendor contact."
