id: "loop.inflated_requirements_search_saturation_loop"
nickname:
  en: "The Search That Outlasts Its Own Reason"
  uk: "Пошук, що переживає власну причину"
axis_x: "chaotic"
axis_y: "visible"
blurb:
  en: "Requirements too high filter out the people who'd fit, the search drags, the team gets tired of it and redefines the role — which resets the filter that started the whole loop."
  uk: "Занадто високі вимоги відсіюють тих, хто підійшов би, пошук затягується, команда втомлюється і перевизначає роль — що скидає фільтр, з якого почався весь цикл."
