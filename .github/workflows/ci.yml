name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Registry Ontology & Graph Integrity
        run: pnpm validate:strict

      - name: Run Test Suite
        run: pnpm test

      - name: Run Coverage
        run: pnpm coverage

      - name: Lint & Format Check
        run: pnpm lint

      - name: Security Audit (prod deps)
        # Fails on high/critical only. Moderates (currently qs via the
        # MCP server's express chain — dev tooling, not the site) are
        # reported but accepted.
        run: pnpm audit --prod --audit-level high

      - name: Build Packages & Static Site
        run: pnpm build

      - name: Verify committed registry exports are up to date
        # `data` is in here because entry bodies are generated from their own
        # frontmatter: a body edited by hand, or left behind by a frontmatter
        # edit, shows up as a diff instead of drifting quietly. The worker
        # source is in here because the redirect table is generated into it —
        # this check is only as wide as what `pnpm build` regenerates, which is
        # why `generate:redirects` had to join the build to be covered at all.
        run: git diff --exit-code --stat -- schemas apps/web/public apps/web/src/worker data

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
          build: false
          lake-package-directory: formal/lean

      - name: Prove the registry's structural claims
        run: pnpm lean

      - name: Verify the generated Lean data is up to date
        # The proofs are only about the registry if the terms they run on were
        # generated from it. A stale Data.lean would prove something true about
        # a registry nobody has.
        run: git diff --exit-code --stat -- formal/lean

      - name: Upload site build
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    # Browser tests (Playwright + axe) against the built static site.
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Playwright imports the workspace packages by source, and that source
      # re-exports its siblings by package name — which resolve to `dist`. This
      # job downloads the site build but builds nothing, so without this every
      # spec fails at import, before a browser opens.
      - name: Build Packages
        run: pnpm build:packages

      - name: Download site build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: apps/web/dist

      - name: Verify the downloaded build
        # Both language trees, the worker that serves them, and the hashed
        # assets. There is no root index.html: public URLs carry no language,
        # so every page lives inside a tree.
        run: |
          test -s apps/web/dist/_i/en/index.html
          test -s apps/web/dist/_i/uk/index.html
          test -s apps/web/dist/_worker.js
          test -d apps/web/dist/_astro
          test -s apps/web/dist/cards/uk/obs.feedback_stating_candidate_is_overqualified_for_the_grade.png

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end and accessibility tests
        run: pnpm e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  deploy:
    # Production deploy to Cloudflare Pages (direct-upload project "hoba-work") on pushes to main.
    # Requires repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
    # wrangler is a pinned devDependency rather than wrangler-action: the action
    # tries to `pnpm add wrangler` in the workspace root, which pnpm refuses.
    # The same binary serves the e2e job, so local and CI run one version.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-and-build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hoba.work
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download site build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: apps/web/dist

      - name: Verify the downloaded build
        # Both language trees, the worker that serves them, and the hashed
        # assets. There is no root index.html: public URLs carry no language,
        # so every page lives inside a tree.
        run: |
          test -s apps/web/dist/_i/en/index.html
          test -s apps/web/dist/_i/uk/index.html
          test -s apps/web/dist/_worker.js
          test -d apps/web/dist/_astro
          test -s apps/web/dist/cards/uk/obs.feedback_stating_candidate_is_overqualified_for_the_grade.png

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy --branch main --commit-dirty=true
