name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Registry Ontology & Graph Integrity
        run: pnpm validate

      - name: Run Test Suite
        run: pnpm test

      - name: Build Packages & Static Site
        run: pnpm build

      - name: Verify committed registry exports are up to date
        run: git diff --exit-code --stat -- schemas site/public
