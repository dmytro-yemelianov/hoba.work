name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Registry Ontology & Graph Integrity
        run: pnpm validate:strict

      - name: Run Test Suite
        run: pnpm test

      - name: Build Packages & Static Site
        run: pnpm build

      - name: Verify committed registry exports are up to date
        run: git diff --exit-code --stat -- schemas site/public

      - name: Upload site build
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  e2e:
    # Browser tests (Playwright + axe) against the built static site.
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download site build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site/dist

      - name: Verify the downloaded build
        run: test -s site/dist/index.html && test -d site/dist/_astro

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end and accessibility tests
        run: pnpm e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  deploy:
    # Production deploy to Cloudflare Pages (direct-upload project "hoba-work") on pushes to main.
    # Requires repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
    # wrangler is a pinned devDependency rather than wrangler-action: the action
    # tries to `pnpm add wrangler` in the workspace root, which pnpm refuses.
    # The same binary serves the e2e job, so local and CI run one version.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-and-build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hoba.work
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download site build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site/dist

      - name: Verify the downloaded build
        run: test -s site/dist/index.html && test -d site/dist/_astro

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy site/dist --project-name hoba-work --branch main --commit-dirty=true
