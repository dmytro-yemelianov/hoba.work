# Weekly dependency updates for the pnpm workspace and CI actions.
# Minor and patch bumps flow automatically (grouped). npm semver-major
# bumps are deliberate, tracked upgrade tasks in this repo — e.g.
# astro 5→7 (clears the known build-time advisories), tailwind 3→4,
# eslint 9→10, typescript 5→7, zod 3→4 — so majors are ignored below.
version: 2
updates:
  # Root manifest: toolchain and dev dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  # Astro site
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
