name: Registry entry
description: A new observation, barrier, mechanism, pattern, loop or intervention — or a correction to one
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Every entry exists in both language mirrors and is validated on commit.
        `pnpm task new <type> "Title"` scaffolds a valid pair with the next free ID.
  - type: dropdown
    id: type
    attributes:
      label: Entity type
      options: [observation (A), barrier (B), mechanism (M), pattern (P), loop (L), intervention (I), evidence (EVD), correction to an existing entry]
    validations: { required: true }
  - type: textarea
    id: claim
    attributes:
      label: What is being claimed
      description: One or two sentences. State it as structure, not as motive.
      placeholder: An automated filter rejects applications whose certification string does not match exactly, so an adjacent certification fails as a miss rather than a near miss.
    validations: { required: true }
  - type: textarea
    id: observable
    attributes:
      label: What a candidate could actually observe
      description: The document, log line or message this shows up in. Reconstructed excerpts are fine — they are labelled as such on the site.
    validations: { required: true }
  - type: textarea
    id: non_inferences
    attributes:
      label: What this does NOT establish
      description: Required. An entry without stated non-inferences will not be merged — this is what separates the registry from a complaint.
    validations: { required: true }
  - type: input
    id: evidence
    attributes:
      label: Evidence
      description: A published source if there is one (raises the entry above `hypothesis`). Leave empty if there is none — that is an honest answer.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: No company, product or person is named anywhere in this entry.
          required: true
        - label: This describes a mechanism, not an intent.
          required: true
