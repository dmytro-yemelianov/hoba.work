# HOBA registry release manifest — the single source of truth for the three
# version axes described in spec §17. Bump `version` on every content release,
# `schema_version` when the entity contract changes. `updated_at` is set
# explicitly (not at build time) so registry exports stay byte-deterministic.
#
# `version` is strict semver as of 1.0.0. The date-coded form it replaced
# (`2026.08.3`) said when a release was cut but nothing about compatibility;
# the dotted-ID migration is what external spec §22 defines as a MAJOR bump, so
# that is what it is numbered. What a release *contains* is identified by
# `registry_hash` in the generated manifest, which is derived from the content
# rather than from the clock.
version: "1.5.0"
schema_version: "1.6.0"
updated_at: "2026-09-05T00:00:00Z"

# The content this release names. Bumping the version without recomputing this
# fails the gate, and so does changing content without bumping — the two used
# to drift silently: the site published "1.0.0, 28 August" over content that
# had moved twelve times since.
release_hash: "d13dee706903c60338c40e225bdd5ba00e7003268c4921e3fed39276049a7642"
